# BORRADOR v0 — el fichero definitivo vive en spin-trainer-api. Solo para validar el contrato.
openapi: 3.1.0
info: { title: Spin Trainer API, version: 0.1.0 }
servers: [{ url: /api/v1 }]
security: [{ bearerAuth: [] }]
paths:
  /situations:
    get:
      operationId: listSituations
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Situation' } } } } }
  /ranges/default/{situation}/{stack}:
    get:
      operationId: getDefaultRange
      parameters: [ { $ref: '#/components/parameters/situation' }, { $ref: '#/components/parameters/stack' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Range' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /ranges/user/{situation}/{stack}:
    parameters: [ { $ref: '#/components/parameters/situation' }, { $ref: '#/components/parameters/stack' } ]
    get:
      operationId: getUserRange
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Range' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: putUserRange
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RangeWrite' } } }
      responses:
        '200': { description: Reemplazado, content: { application/json: { schema: { $ref: '#/components/schemas/Range' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUserRange
      responses: { '204': { description: Borrado } }
  /quiz/attempts:
    get:
      operationId: listAttempts
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Attempt' } } } } }
    post:
      operationId: recordAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptWrite' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    situation: { name: situation, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]+$' } }
    stack: { name: stack, in: path, required: true, schema: { type: number } }
  responses:
    Problem:
      description: RFC 7807
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Hand: { type: string, pattern: '^([AKQJT2-9])([AKQJT2-9])([so])?$' }
    Action: { type: string, enum: [MR_4B_C, MR_C_C, MR_C_F, MR_F_F, L_C_C, L_C_F, L_PUSH, L_F, ALLIN, 3BET, 3BET_C, 3B_CALL, CALL, CALL_VS_X2, ISO_C, ISO_F, LIMP, CHECK, FOLD] }
    Situation:
      type: object
      required: [key, label, format, stacks, actions]
      properties:
        key: { type: string }
        label: { type: string }
        format: { type: string, enum: [3max, hu] }
        stacks: { type: array, items: { type: number } }
        actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
        notes: { type: string }
    Hands:
      type: object
      additionalProperties: { $ref: '#/components/schemas/Action' }
    Range:
      type: object
      required: [situation, stack, hands, source, version]
      properties:
        situation: { type: string }
        stack: { type: number }
        hands: { $ref: '#/components/schemas/Hands' }
        source: { type: string, enum: [default, user] }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    RangeWrite:
      type: object
      required: [hands]
      properties:
        hands: { $ref: '#/components/schemas/Hands' }
        version: { type: integer, description: Versión leída; 409 si no coincide }
    AttemptWrite:
      type: object
      required: [situation, stack, hand, expected, given]
      properties:
        situation: { type: string }
        stack: { type: number }
        hand: { $ref: '#/components/schemas/Hand' }
        expected: { $ref: '#/components/schemas/Action' }
        given: { $ref: '#/components/schemas/Action' }
    Attempt:
      allOf:
        - $ref: '#/components/schemas/AttemptWrite'
        - type: object
          required: [id, correct, at]
          properties:
            id: { type: string, format: uuid }
            correct: { type: boolean }
            at: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
